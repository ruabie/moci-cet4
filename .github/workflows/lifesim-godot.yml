name: LifeSim Godot engine smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'
  push:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'

permissions:
  contents: read

jobs:
  godot-import-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_DIR: lifesim/godot
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Source admission gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/project.godot" || { echo 'BLOCKED: real Godot source not connected'; exit 1; }
          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/tests/qa_headless.gd"
      - name: Install official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Build reproducible original GLB assets
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/build_assets.py"
          python3 "$PROJECT_DIR/tools/build_street_v07.py"
          python3 "$PROJECT_DIR/tools/build_street_v08.py"
          python3 "$PROJECT_DIR/tests/check_authored_assets.py"
          python3 "$PROJECT_DIR/tests/check_integrated_street.py"
          python3 "$PROJECT_DIR/tests/check_pbr_street.py"
          python3 "$PROJECT_DIR/tools/build_coffee_v09.py"
          python3 "$PROJECT_DIR/tests/check_v09_hero.py"
          python3 "$PROJECT_DIR/tools/build_landscape_v10.py"
          python3 "$PROJECT_DIR/tests/check_landscape_v10.py"
          python3 "$PROJECT_DIR/tests/check_open_city_v11.py"
          python3 "$PROJECT_DIR/tools/build_interiors_v12.py"
          python3 "$PROJECT_DIR/tests/check_compact_interiors_v12.py"
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tests/check_structure.py"
          python3 "$PROJECT_DIR/tests/check_delimiters.py"
          python3 "$PROJECT_DIR/tests/check_regressions.py"
          python3 "$PROJECT_DIR/tests/check_visual_upgrade.py"
      - name: Godot import and actual GDScript parse
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --editor --path "$PROJECT_DIR" --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*Parse' godot-import.log; then exit 1; fi
      - name: Godot scene and economy contract tests
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --path "$PROJECT_DIR" --script res://tests/qa_headless.gd 2>&1 | tee godot-qa.log
          if grep -E 'QA FAIL|SCRIPT ERROR|Parse Error' godot-qa.log; then exit 1; fi
          grep -F 'QA PASS:' godot-qa.log
      - name: Install virtual display and Mesa for viewport proof
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri fonts-noto-cjk
      - name: Render screenshot through Godot OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24"             "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --rendering-driver opengl3 --path "$PROJECT_DIR"             --script res://tests/visual_capture.gd 2>&1 | tee godot-visual.log
          grep -F 'CAPTURE PASS:' godot-visual.log
          test -s "$PROJECT_DIR/tests/visual_evidence.png"
          test -s "$PROJECT_DIR/tests/visual_walk_evidence.png"
          test -s "$PROJECT_DIR/tests/v07_facade_inspection.png"
      - name: Render V0.8 hero facades with actual Godot OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s " -screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v08.gd 2>&1 | tee godot-v08-visual.log
          grep -F 'V08 CAPTURE PASS:' godot-v08-visual.log
          test -s "$PROJECT_DIR/tests/v08_hero_cafe.png"
          test -s "$PROJECT_DIR/tests/v08_hero_mart.png"
      - name: Capture curated V0.9 cafe from fixed V0.8 comparison view
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v09.gd 2>&1 | tee godot-v09-visual.log
          grep -F 'V09 CAPTURE PASS:' godot-v09-visual.log
          test -s "$PROJECT_DIR/tests/v09_cafe_compare.png"
          test -s "$PROJECT_DIR/tests/v09_cafe_street.png"
      - name: Capture V0.10 landscape, trees and same-view comparison
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v10.gd 2>&1 | tee godot-v10-visual.log
          grep -F 'V10 CAPTURE PASS:' godot-v10-visual.log
          test -s "$PROJECT_DIR/tests/v10_cafe_same_camera.png"
          test -s "$PROJECT_DIR/tests/v10_street_landscape.png"
          test -s "$PROJECT_DIR/tests/v10_park_trees.png"
      - name: Capture V0.11 actual furnished spaces and licensed neighborhood
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v11.gd 2>&1 | tee godot-v11-visual.log
          grep -F 'V11 CAPTURE PASS:' godot-v11-visual.log
          test -s "$PROJECT_DIR/tests/v11_cafe.png"
          test -s "$PROJECT_DIR/tests/v11_mart.png"
          test -s "$PROJECT_DIR/tests/v11_home.png"
          test -s "$PROJECT_DIR/tests/v11_licensed_block.png"
      - name: Capture six V0.12 furnished interior views in real Godot OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v12.gd 2>&1 | tee godot-v12-visual.log
          grep -F 'V12 CAPTURE PASS:' godot-v12-visual.log
          test -s "$PROJECT_DIR/tests/v12_cafe_front.png"
          test -s "$PROJECT_DIR/tests/v12_mart_front.png"
          test -s "$PROJECT_DIR/tests/v12_home_front.png"
      - name: Archive this exact verified Godot project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v012-godot-source-verified
          path: |
            lifesim/godot/
            !lifesim/godot/.godot/**
            !lifesim/godot/tests/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Save logs even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-godot-logs
          path: |
            godot-import.log
            godot-qa.log
            godot-visual.log
            godot-v08-visual.log
            godot-v09-visual.log
            godot-v10-visual.log
            godot-v11-visual.log
            godot-v12-visual.log
            lifesim/godot/tests/v11_*.png
            lifesim/godot/tests/v12_*.png
            lifesim/godot/tests/v08_hero_*.png
            lifesim/godot/tests/v09_cafe_*.png
            lifesim/godot/tests/v10_*.png
            lifesim/godot/art/vegetation/*.glb
            lifesim/godot/tests/visual_evidence.png
            lifesim/godot/tests/visual_walk_evidence.png
            lifesim/godot/tests/v07_facade_inspection.png
            lifesim/godot/art/characters/*.glb
            lifesim/godot/art/architecture/*.glb
          if-no-files-found: warn
          retention-days: 14
