name: LifeSim Godot engine smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'
  push:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'

permissions:
  contents: read

jobs:
  godot-import-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_DIR: lifesim/godot
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Source admission gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/project.godot" || { echo 'BLOCKED: real Godot source not connected'; exit 1; }
          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/tests/qa_headless.gd"
      - name: Install official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tests/check_structure.py"
          python3 "$PROJECT_DIR/tests/check_delimiters.py"
          python3 "$PROJECT_DIR/tests/check_regressions.py"
      - name: Godot import and actual GDScript parse
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --editor --path "$PROJECT_DIR" --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*Parse' godot-import.log; then exit 1; fi
      - name: Godot scene and economy contract tests
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --path "$PROJECT_DIR" --script res://tests/qa_headless.gd 2>&1 | tee godot-qa.log
          if grep -E 'QA FAIL|SCRIPT ERROR|Parse Error' godot-qa.log; then exit 1; fi
          grep -F 'QA PASS:' godot-qa.log
      - name: Install virtual display and Mesa for viewport proof
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri fonts-noto-cjk
      - name: Render screenshot through Godot OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24"             "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --rendering-driver opengl3 --path "$PROJECT_DIR"             --script res://tests/visual_capture.gd 2>&1 | tee godot-visual.log
          grep -F 'CAPTURE PASS:' godot-visual.log
          test -s "$PROJECT_DIR/tests/visual_evidence.png"
      - name: Save logs even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-godot-logs
          path: |
            godot-import.log
            godot-qa.log
            godot-visual.log
            lifesim/godot/tests/visual_evidence.png
          if-no-files-found: warn
          retention-days: 14
