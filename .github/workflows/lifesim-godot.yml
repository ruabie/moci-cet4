name: LifeSim Godot engine smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'
  push:
    paths:
      - 'lifesim/godot/**'
      - '.github/workflows/lifesim-godot.yml'

permissions:
  contents: read

jobs:
  godot-import-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_DIR: lifesim/godot
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Source admission gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/project.godot" || { echo 'BLOCKED: real Godot source not connected'; exit 1; }
          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/tests/qa_headless.gd"
      - name: Install official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Install reproducible offline cafe GLB crop dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/lifesim-v14-python
          /tmp/lifesim-v14-python/bin/pip install --quiet trimesh==4.11.1 numpy pillow
      - name: Acquire immutable CC0 Quaternius animation library (build-time only)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/acquire_ual_v21.py"
          test -s "$PROJECT_DIR/art/animations/v21/ual1_inplace.glb"
          test -s "$PROJECT_DIR/tests/v21_ual_manifest.json"
      - name: Build reproducible original GLB assets
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/build_assets.py"
          python3 "$PROJECT_DIR/tools/build_street_v07.py"
          python3 "$PROJECT_DIR/tools/build_street_v08.py"
          python3 "$PROJECT_DIR/tests/check_authored_assets.py"
          python3 "$PROJECT_DIR/tests/check_characters_v18.py"
          python3 "$PROJECT_DIR/tests/check_integrated_street.py"
          python3 "$PROJECT_DIR/tests/check_pbr_street.py"
          python3 "$PROJECT_DIR/tools/build_coffee_v09.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/build_upper_cafe_v14.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/build_upper_mart_v15.py"
          python3 "$PROJECT_DIR/tests/check_v09_hero.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tests/check_seamless_v14.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tests/check_seamless_v15.py"
          python3 "$PROJECT_DIR/tools/build_landscape_v10.py"
          python3 "$PROJECT_DIR/tests/check_landscape_v10.py"
          python3 "$PROJECT_DIR/tests/check_open_city_v11.py"
          python3 "$PROJECT_DIR/tools/build_art_v13.py"
          python3 "$PROJECT_DIR/tests/check_art_v13.py"
          python3 "$PROJECT_DIR/tools/build_interiors_v12.py"
          python3 "$PROJECT_DIR/tests/check_compact_interiors_v12.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/build_mart_v16.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tests/check_mart_visual_v16.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/build_mart_v17.py"
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tests/check_mart_visual_v17.py"
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tests/check_structure.py"
          python3 "$PROJECT_DIR/tests/check_delimiters.py"
          python3 "$PROJECT_DIR/tests/check_regressions.py"
          python3 "$PROJECT_DIR/tests/check_visual_upgrade.py"
      - name: Godot import and actual GDScript parse
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --editor --path "$PROJECT_DIR" --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*Parse' godot-import.log; then exit 1; fi
      - name: Godot scene and economy contract tests
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"             --headless --path "$PROJECT_DIR" --script res://tests/qa_headless.gd 2>&1 | tee godot-qa.log
          if grep -E 'QA FAIL|SCRIPT ERROR|Parse Error' godot-qa.log; then exit 1; fi
          grep -F 'QA PASS:' godot-qa.log
          grep -F 'V18 QA PASS:' godot-qa.log
          grep -F 'V15 QA PASS:' godot-qa.log
          grep -F 'V16 QA PASS:' godot-qa.log
          grep -F 'V17 QA PASS:' godot-qa.log
      - name: Install virtual display and Mesa for viewport proof
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri fonts-noto-cjk
      # Historical visual evidence remains in previously verified run artifacts.
      # All existing gameplay, physics and save QA above continues to run.
      - name: Capture V0.16 real retail shelf heights, small SKU packs and fridges
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v16.gd 2>&1 | tee godot-v16-visual.log
          grep -F 'V16 CAPTURE PASS:' godot-v16-visual.log
          test -s "$PROJECT_DIR/tests/v16_shop_aisles.png"
          test -s "$PROJECT_DIR/tests/v16_stock_closeup.png"
          test -s "$PROJECT_DIR/tests/v16_refrigeration.png"
      - name: Capture V0.17 same-camera store and true-depth refrigerator views
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v17.gd 2>&1 | tee godot-v17-visual.log
          grep -F 'V17 CAPTURE PASS:' godot-v17-visual.log
          for view in shop_aisles refrigerator_cavity cold_stock_detail storefront; do
            test -s "$PROJECT_DIR/tests/v17_${view}.png"
          done
      - name: V0.18 render actual skinned civilians and six distinct outfits
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v18.gd 2>&1 | tee godot-v18-visual.log
          grep -F 'V18 CAPTURE PASS:' godot-v18-visual.log
          test -s "$PROJECT_DIR/tests/v18_player_in_city.png"
          test -s "$PROJECT_DIR/tests/v18_player_closeup.png"
          test -s "$PROJECT_DIR/tests/v18_six_residents.png"
      - name: Capture V0.19 actual-input walking phases, turn and stop
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v19_motion.gd 2>&1 | tee godot-v19-motion.log
          grep -F 'V19 MOTION PASS:' godot-v19-motion.log
          for state in walking_early walking_late turning stopped; do
            test -s "$PROJECT_DIR/tests/v19_${state}.png"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("lifesim/godot/tests/v19_motion_metrics.json").read_text())
          assert obj["player_displacement_metres"] >= 1.4
          assert obj["left_thigh_phase_angle_radians"] >= 0.12
          assert obj["turn_angle_radians"] >= 0.45
          print("V19 MOTION METRICS PASS", obj)
          PY
      - name: Capture V0.20 real gait sequence and measure ankle floor guard
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v20_gait.gd 2>&1 | tee godot-v20-gait.log
          grep -F 'V20 GAIT PASS:' godot-v20-gait.log
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/assemble_gait_v20.py"
          test -s "$PROJECT_DIR/tests/v20_gait_sequence.gif"
          test -s "$PROJECT_DIR/tests/v20_gait_contact_sheet.png"
          test -s "$PROJECT_DIR/tests/v20_gait_metrics.json"

      - name: V0.21 true licensed animation retarget smoke and fixed-camera rendering
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v21_retarget.gd 2>&1 | tee godot-v21-retarget.log
          grep -F 'V21 RETARGET PASS:' godot-v21-retarget.log
          for state in idle_a idle_b walk_a walk_b run_a run_b; do
            test -s "$PROJECT_DIR/tests/v21_${state}.png"
          done
          test -s "$PROJECT_DIR/tests/v21_retarget_metrics.json"
      - name: V0.22 rest-axis and actual road-ground contact diagnostic render
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v22_contact.gd 2>&1 | tee godot-v22-contact.log
          grep -F 'V22 CONTACT PASS:' godot-v22-contact.log
          for state in idle_a idle_b walk_a walk_b run_a run_b; do
            test -s "$PROJECT_DIR/tests/v22_${state}.png"
          done
          test -s "$PROJECT_DIR/tests/v22_contact_metrics.json"

      - name: V0.22 continuous clip timeline, measured ground-contact correction and review GIFs
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v22_sequence.gd 2>&1 | tee godot-v22-sequence.log
          grep -F 'V22 SEQUENCE PASS:' godot-v22-sequence.log
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/assemble_v22_sequence.py"
          for motion in walk run; do
            test -s "$PROJECT_DIR/tests/v22_${motion}_timeline.gif"
            test -s "$PROJECT_DIR/tests/v22_${motion}_contact_sheet.jpg"
          done
          test -s "$PROJECT_DIR/tests/v22_sequence_metrics.json"

      - name: V0.23 Godot-native two-leg IK, humanoid BoneMap and actual skeletal foot-error proof
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --rendering-driver opengl3 --path "$PROJECT_DIR" \
            --script res://tests/visual_v23_native_ik.gd 2>&1 | tee godot-v23-native-ik.log
          grep -F 'V23 NATIVE IK PASS:' godot-v23-native-ik.log
          /tmp/lifesim-v14-python/bin/python "$PROJECT_DIR/tools/assemble_v23_native_ik.py"
          for motion in walk run; do
            test -s "$PROJECT_DIR/tests/v23_${motion}_ik.gif"
            test -s "$PROJECT_DIR/tests/v23_${motion}_ik_sheet.jpg"
          done
          test -s "$PROJECT_DIR/tests/v23_native_ik_metrics.json"

      - name: Archive this exact verified Godot project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v018-godot-source-verified
          path: |
            lifesim/godot/
            !lifesim/godot/.godot/**
            !lifesim/godot/tests/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Save logs even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-godot-logs
          path: |
            godot-v17-visual.log
            lifesim/godot/tests/v17_*.png
            godot-v16-visual.log
            lifesim/godot/tests/v16_*.png
            godot-import.log
            godot-qa.log
            godot-v18-visual.log
            godot-v19-motion.log
            godot-v20-gait.log
            godot-v21-retarget.log
            godot-v22-contact.log
            godot-v22-sequence.log
            godot-v23-native-ik.log
            lifesim/godot/tests/v23_*.png
            lifesim/godot/tests/v23_*.jpg
            lifesim/godot/tests/v23_*.gif
            lifesim/godot/tests/v23_*.json
            lifesim/godot/tests/v22_*.gif
            lifesim/godot/tests/v22_*.jpg
            lifesim/godot/tests/v22_*.png
            lifesim/godot/tests/v22_*.json
            lifesim/godot/tests/v21_*.png
            lifesim/godot/tests/v21_*.json
            lifesim/godot/tests/v20_*.png
            lifesim/godot/tests/v20_*.gif
            lifesim/godot/tests/v20_*.json
            lifesim/godot/tests/v19_*.png
            lifesim/godot/tests/v19_motion_metrics.json
            lifesim/godot/tests/v18_*.png
            godot-visual.log
            godot-v08-visual.log
            godot-v09-visual.log
            godot-v10-visual.log
            godot-v11-visual.log
            godot-v13-visual.log
            godot-v14-visual.log
            godot-v15-visual.log
            lifesim/godot/tests/v15_*.png
            lifesim/godot/tests/v14_*.png
            lifesim/godot/tests/v13_*.png
            godot-v12-visual.log
            lifesim/godot/tests/v11_*.png
            lifesim/godot/tests/v12_*.png
            lifesim/godot/tests/v08_hero_*.png
            lifesim/godot/tests/v09_cafe_*.png
            lifesim/godot/tests/v10_*.png
            lifesim/godot/art/vegetation/*.glb
            lifesim/godot/tests/visual_evidence.png
            lifesim/godot/tests/visual_walk_evidence.png
            lifesim/godot/tests/v07_facade_inspection.png
            lifesim/godot/art/characters/*.glb
            lifesim/godot/art/architecture/*.glb
          if-no-files-found: warn
          retention-days: 14
