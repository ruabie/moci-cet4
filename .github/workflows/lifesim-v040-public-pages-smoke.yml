name: LifeSim V0.40 genuine public GitHub Pages WebGL browser smoke (read only)
on:
  push:
    branches: [lifesim-v040-third-person-near-wall-visibility]
    paths:
      - '.github/workflows/lifesim-v040-public-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PUBLIC_URL: 'https://ruabie.github.io/moci-cet4/lifesim/play-v40/?qa=1'
      PREVIEW_EVIDENCE: 'v040-live-public-site-evidence'
      PLAYWRIGHT_ROOT: '/tmp/lifesim-live-public-playwright'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prove actual deployed Pages URL and real binary game files exist over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            html=$(curl -L -sS -o /tmp/v40-public-index.html -w '%{http_code}' --max-time 10 "$PUBLIC_URL" || true)
            js=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 10 "https://ruabie.github.io/moci-cet4/lifesim/play-v40/index.js" || true)
            wasm=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 10 "https://ruabie.github.io/moci-cet4/lifesim/play-v40/index.wasm" || true)
            pck=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 10 "https://ruabie.github.io/moci-cet4/lifesim/play-v40/index.pck" || true)
            printf 'PUBLIC_SITE_CHECK attempt=%s html=%s js=%s wasm=%s pck=%s\n' "$attempt" "$html" "$js" "$wasm" "$pck"
            if [[ "$html" == 200 && "$js" == 200 && "$wasm" == 200 && "$pck" == 200 ]] && grep -q "Godot" /tmp/v40-public-index.html; then break; fi
            sleep 5
          done
          [[ "$html" == 200 && "$js" == 200 && "$wasm" == 200 && "$pck" == 200 ]]
          curl -L -fsS --max-time 10 'https://ruabie.github.io/moci-cet4/lifesim/play-v40/build-info.json' -o /tmp/v40-public-build-info.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/v40-public-build-info.json"))
          assert x["head_sha"]=="2b8b582cf4d68b2bc2537c81bd9a086621828bd6"
          assert x["web_files"]["index.wasm"]["bytes"]==39514754
          print("AUTHENTIC VERSIONED V040 PUBLIC PAGES HTTPS INDEX + JS + WASM + PCK PASS")
          PY
          echo "PUBLIC_WASM_HEADERS"; curl -sSI 'https://ruabie.github.io/moci-cet4/lifesim/play-v40/index.wasm' | head -n 25
          echo "OLD_SITE_PRESERVED"; old=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 10 'https://ruabie.github.io/moci-cet4/lifesim/play-v18/'); test "$old" = 200
      - name: Install isolated real Chromium without a publishing action
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-audit --no-fund --ignore-scripts playwright@1.58.2
          "$PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actually load GitHub Pages V0.40 Godot WebGL2 and move original CityPlayer with physical W
        shell: bash
        run: |
          set -euo pipefail
          export PREVIEW_URL="$PUBLIC_URL"
          node lifesim/godot/tools/v040_isolated_web_browser_audit.mjs | tee v040-live-chromium.log
          grep -F "V040 REAL CHROMIUM GODOT WEB BOOT AND W KEY PASS:" v040-live-chromium.log
      - name: Keep authentic public HTTPS screenshot and logs even if browser fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v040-public-pages-browser-pass-or-failure
          path: |
            v040-live-public-site-evidence/
            v040-live-chromium.log
            /tmp/v40-public-build-info.json
          if-no-files-found: warn
          retention-days: 14
