name: LifeSim V0.16 live public Chromium verification

on:
  push:
    branches: [lifesim-v016-merchandising-art]
    paths:
      - '.github/workflows/lifesim-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Confirm public V0.16 assets and exact edition
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ruabie.github.io/moci-cet4/lifesim/play-v16"
          for retry in $(seq 1 12); do
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 50 "$BASE/build-info.json?check=$GITHUB_RUN_ID" -o /tmp/v16-info.json; then
              if grep -q '"version": "0.16"' /tmp/v16-info.json && grep -q 'lifesim-v016-merchandising-art' /tmp/v16-info.json; then break; fi
            fi
            sleep 8
          done
          cat /tmp/v16-info.json
          grep -q '"version": "0.16"' /tmp/v16-info.json
          grep -q 'lifesim-v016-merchandising-art' /tmp/v16-info.json
          for file in index.html index.js index.wasm index.pck; do
            curl -fLsS --head --connect-timeout 10 --max-time 45 "$BASE/$file" | grep -iE 'HTTP/|content-length'
          done
          echo 'V15 PUBLIC ASSETS PASS'
      - name: Setup Playwright and system Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Drive the actual published game with WASD and HUD input
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v16-browser.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader',
                    '--use-angle=swiftshader','--use-gl=angle','--enable-webgl']
            });
            const page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
            page.setDefaultTimeout(60000);
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
            await page.goto('https://ruabie.github.io/moci-cet4/lifesim/play-v16/?qa=1',{waitUntil:'domcontentloaded',timeout:60000});
            const gl2=await page.evaluate(()=>!!document.createElement('canvas').getContext('webgl2'));
            if(!gl2)throw Error('Chromium did not expose WebGL2');
            await page.waitForFunction(()=>typeof window.__LIFESIM_QA__?.getState==='function',null,{timeout:85000});
            await page.waitForTimeout(1000);
            const read=()=>page.evaluate(()=>window.__LIFESIM_QA__.getState());
            const before=await read();
            if(!Number.isFinite(before.x)||!Number.isFinite(before.z))throw Error('missing read-only game position');
            await page.screenshot({path:'v16-public-start.png',fullPage:true});
            const canvas=page.locator('canvas');
            if(!await canvas.count())throw Error('Godot rendering canvas missing');
            await canvas.click({position:{x:630,y:440},force:true});
            await page.waitForTimeout(350);
            await page.keyboard.down('a');
            await page.waitForTimeout(3800);
            await page.keyboard.up('a');
            await page.waitForTimeout(1000);
            const after=await read();
            const moved=Math.hypot(after.x-before.x,after.z-before.z);
            console.log('V16_REAL_MOVE',JSON.stringify({before,after,metres:moved}));
            await page.screenshot({path:'v16-public-movement.png',fullPage:true});
            if(moved<0.25 || moved>40)throw Error('published 3D game failed real keyboard movement: '+moved);
            // Verify the HUD shortcut by using the real keyboard, never a state mutation.
            await page.keyboard.down('h');
            await page.waitForTimeout(1200);
            await page.keyboard.up('h');
            await page.waitForTimeout(800);
            await page.waitForFunction(previous => window.__LIFESIM_QA__?.getState()?.hud_visible !== previous, after.hud_visible, {timeout:30000,polling:400});
            const afterHud=await read();
            console.log('V16_REAL_HUD',JSON.stringify({before:after.hud_visible,after:afterHud.hud_visible}));
            await page.screenshot({path:'v16-public-hud-toggle.png',fullPage:true});
            if(afterHud.hud_visible===after.hud_visible)throw Error('H keyboard HUD toggle failed');
            console.log('V16_BROWSER_ERRORS',JSON.stringify(errors.slice(-15)));
            if(errors.some(s=>/Failed to load|WebGL|Unable to initialize|Missing Resource|Cannot open file|SCRIPT ERROR|Parse Error/i.test(s)))
              throw Error('Godot browser runtime errors: '+errors.join(' | '));
            await browser.close();
            console.log('V15 PUBLIC CHROMIUM REAL INPUT PASS (not an art-quality or Windows FPS certification)');
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          node /tmp/v16-browser.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v015-public-chromium-evidence
          path: |
            v16-public-start.png
            v16-public-movement.png
            v16-public-hud-toggle.png
          if-no-files-found: warn
          retention-days: 14
