name: LifeSim V0.14 public WebGL and no-teleport smoke

on:
  push:
    branches: [lifesim-v014-seamless-cafe]
    paths:
      - '.github/workflows/lifesim-v014-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Confirm public HTML, WebAssembly and PCK availability
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ruabie.github.io/moci-cet4/lifesim/play-v14"
          for i in $(seq 1 14); do
            if curl --fail --location --silent --show-error --max-time 30 \
               "$BASE/build-info.json" | grep -q '"version": "0.14"'; then break; fi
            sleep 10
          done
          for name in index.html index.js index.wasm index.pck build-info.json; do
            curl --fail --location --silent --show-error --head \
              --max-time 35 "$BASE/$name" | grep -E -i 'HTTP/|content-type' | head -3
          done
          echo "V14 HTTP PASS: public engine, content and version files reachable"
      - name: Install Chromium smoke dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Real WebGL2, HUD, world time and movement test
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          cat > /tmp/v14-public.cjs <<'JS'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader',
                    '--use-angle=swiftshader','--use-gl=angle','--enable-webgl']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('https://ruabie.github.io/moci-cet4/lifesim/play-v14/?qa=1',
              {waitUntil:'domcontentloaded',timeout:65000});
            await page.waitForTimeout(14000);
            await page.waitForFunction(()=>typeof window.__LIFESIM_QA__?.getState==='function',{timeout:30000});
            const gl2=await page.evaluate(()=>!!document.createElement('canvas').getContext('webgl2'));
            const before=await page.evaluate(()=>window.__LIFESIM_QA__.getState());
            await page.screenshot({path:'v14-public-start.png',fullPage:true});
            await page.locator('canvas').click({position:{x:640,y:410},force:true});
            await page.keyboard.down('e');
            await page.waitForTimeout(2000);
            await page.keyboard.up('e');
            await page.waitForTimeout(500);
            const afterE=await page.evaluate(()=>window.__LIFESIM_QA__.getState());
            console.log('V14_E_INTERACT',JSON.stringify({before,afterE}));
            if(afterE.indoor==='咖啡馆'||Math.hypot(afterE.x-before.x,afterE.z-before.z)>.3)
              throw new Error('V14 E key still teleports instead of physical doorway');
            await page.keyboard.down('w');
            await page.waitForTimeout(8000);
            await page.keyboard.up('w');
            await page.waitForTimeout(500);
            const moved=await page.evaluate(()=>window.__LIFESIM_QA__.getState());
            await page.screenshot({path:'v14-public-movement.png',fullPage:true});
            console.log('V14_MOVE',JSON.stringify({afterE,moved}));
            if(Math.hypot(moved.x-afterE.x,moved.z-afterE.z)<.6)
              throw new Error('W key did not move the avatar more than 0.6m');
            if(!gl2 || !document)throw new Error('WebGL2 missing');
            if(errors.some(x=>/SCRIPT ERROR|ERROR:|Failed to load|Unable to initialize|WebGL/i.test(x)))
              throw new Error('Browser game error: '+errors.slice(-8).join(' / '));
            console.log('V14 BROWSER PASS: public 3D game renders, E never teleports, W moves, no asset errors');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/v14-public.cjs
      - name: Retain screenshots even if smoke fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v014-public-evidence
          path: |
            v14-public-start.png
            v14-public-movement.png
          if-no-files-found: warn
          retention-days: 14
