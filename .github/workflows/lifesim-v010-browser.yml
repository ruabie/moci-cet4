name: LifeSim V0.10 public browser evidence
on:
  push:
    branches: [lifesim-v010-landscape-depth]
    paths: ['.github/workflows/lifesim-v010-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact V0.10 Pages publication and dependencies
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ruabie.github.io/moci-cet4/lifesim/play-v10"
          for i in $(seq 1 20); do
            curl --fail --location --silent --show-error --max-time 30 \
              "$BASE/build-info.json?check=$i" -o /tmp/info.json || true
            if grep -q "9a46d2f995445cd05b6f655c298916bc1443ac15" /tmp/info.json 2>/dev/null; then break; fi
            echo "Pages V0.10 revision not yet live: retry $i"
            sleep 10
          done
          grep -q '"version": "0.10"' /tmp/info.json
          grep -q '9a46d2f995445cd05b6f655c298916bc1443ac15' /tmp/info.json
          for f in index.html index.js index.wasm index.pck; do
            curl --fail --location --silent --show-error --head "$BASE/$f" | grep -E -i 'HTTP/|content-type|content-length'
          done
          echo 'V10 HTTP LIVE PASS'
      - uses: actions/checkout@v4
      - name: Install Playwright client
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Actual Chrome + WebGL2 render smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lifesim-v10-chrome.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader',
                    '--use-angle=swiftshader','--use-gl=angle','--enable-webgl']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('https://ruabie.github.io/moci-cet4/lifesim/play-v10/?qa=1',{
              waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(18000);
            const state=await page.evaluate(()=>({
              title:document.title,
              canvas:!!document.querySelector('canvas'),
              webgl2:!!document.createElement('canvas').getContext('webgl2'),
              qa:typeof window.__LIFESIM_QA__?.getState==='function',
              notice:document.getElementById('status-notice')?.textContent?.slice(0,120)}));

            const original=await page.evaluate(()=>window.__LIFESIM_QA__?.getState?.());
            await page.keyboard.down('w');
            await page.waitForTimeout(1300);
            await page.keyboard.up('w');
            await page.waitForTimeout(350);
            const moved=await page.evaluate(()=>window.__LIFESIM_QA__?.getState?.());
            await page.screenshot({path:'v10-public-chrome.png',fullPage:true});
            const displacement=original&&moved?Math.hypot(moved.x-original.x,moved.z-original.z):0;
            console.log('V10 MOVEMENT PROOF',JSON.stringify({displacement,original,moved}));
            if (!state.qa || displacement<0.12) process.exitCode=1;
            console.log('V10 CHROME SNAPSHOT',JSON.stringify({state,errors:errors.slice(-6)}));
            await browser.close();
            if(!state.canvas||!state.webgl2||errors.some(x=>/Failed to load|WebGL|error loading|Unable to initialize|CompileError|NotAllowedError.*Pointer Lock/i.test(x)))
              process.exit(1);
            console.log('V10 CHROME WEBGL2 RENDER PASS — not a full gameplay, FPS or art review');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lifesim-v10-chrome.cjs
          test -s v10-public-chrome.png
      - name: Preserve actual public screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v10-public-browser-evidence
          path: v10-public-chrome.png
          retention-days: 14
          if-no-files-found: warn
