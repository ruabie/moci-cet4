name: LifeSim V0.27 focused rig importer + real Godot three-way render

on:
  push:
    paths:
      - '.github/workflows/lifesim-v27-fast-render.yml'
      - 'lifesim/godot/tools/audit_constant_rest_v27.py'
      - 'lifesim/godot/scripts/compatible_anim_v26.gd'
      - 'lifesim/godot/tests/diagnostic_v27_import_tracks.gd'
  pull_request:
    paths:
      - '.github/workflows/lifesim-v27-fast-render.yml'
      - 'lifesim/godot/tools/audit_constant_rest_v27.py'
      - 'lifesim/godot/scripts/compatible_anim_v26.gd'
      - 'lifesim/godot/tests/diagnostic_v27_import_tracks.gd'
      - 'lifesim/godot/tests/visual_v26_rig_compare.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-ual-source-to-base-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 with Mesa and Python image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libglu1-mesa
          python3 -m pip install --user --break-system-packages 'pillow>=10,<12'
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-v27.zip
          mkdir -p /tmp/godot-v27
          unzip -q /tmp/godot-v27.zip -d /tmp/godot-v27
          chmod +x /tmp/godot-v27/Godot_v4.7.2-stable_linux.x86_64
      - name: Download only immutable CC0 UAL, base and old civilian (build-time, no public deploy)
        shell: bash
        run: |
          set -euo pipefail
          cd lifesim/godot
          python3 tools/acquire_ual_v21.py
          python3 tools/acquire_base_v26.py
          mkdir -p art/characters/v18
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/0128ca510d653bb04d6d1e4885bd8890b5050b4f/public/glb/modular_men/Casual2.glb' \
            -o art/characters/v18/player_casual.glb
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('art/characters/v18/player_casual.glb')
          d=p.read_bytes()
          sha=hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          assert sha=='8de02ab8cc15be5d4375373675f886d347bef11e',sha
          print('V27 LEGACY GLB PIN VERIFIED:',sha)
          PY
      - name: Independently prove original spine_01 is identical to rest; reject missing animated legs
        shell: bash
        run: |
          set -euo pipefail
          cd lifesim/godot
          python3 tools/audit_constant_rest_v27.py | tee v27-raw-source.log
          grep -F 'V27 REAL GLB CONSTANT REST PASS:' v27-raw-source.log
          python3 tools/audit_rigs_v26.py
      - name: Import actual pinned GLBs through Godot 4.7.2 editor
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          /tmp/godot-v27/Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path lifesim/godot --quit 2>&1 | tee v27-godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*Parse' v27-godot-import.log; then exit 1; fi
      - name: Inspect source animation paths and render 15 genuine three-way Godot frames
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            /tmp/godot-v27/Godot_v4.7.2-stable_linux.x86_64 \
            --rendering-driver opengl3 --path lifesim/godot \
            --script res://tests/diagnostic_v27_import_tracks.gd 2>&1 | tee v27-track-import.log
          grep -F 'V27 GODOT TRACK INVENTORY PASS:' v27-track-import.log
          timeout --signal=TERM --kill-after=10s 150s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            /tmp/godot-v27/Godot_v4.7.2-stable_linux.x86_64 \
            --rendering-driver opengl3 --path lifesim/godot \
            --script res://tests/visual_v26_rig_compare.gd 2>&1 | tee v27-actual-renders.log
          grep -F 'V26 THREE RIG RENDER PASS:' v27-actual-renders.log
          python3 lifesim/godot/tools/assemble_v26_review.py
          test -s lifesim/godot/tests/v26_three_rig_same_phase_review.jpg
      - name: Preserve real source/engine evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifesim-v027-three-rig-real-render-or-failure
          path: |
            v27-raw-source.log
            v27-godot-import.log
            v27-track-import.log
            v27-actual-renders.log
            lifesim/godot/tests/v27_source_constant_rest.json
            lifesim/godot/tests/v27_godot_import_tracks.json
            lifesim/godot/tests/v26_visual_metrics.json
            lifesim/godot/tests/v26_rig_audit.json
            lifesim/godot/tests/v26_three_rig_same_phase_review.jpg
            lifesim/godot/tests/v26_*.png
          if-no-files-found: warn
          retention-days: 14
