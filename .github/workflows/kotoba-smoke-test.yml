name: Kotoba published-site check
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTML, vocabulary data and app scripts load
        shell: bash
        run: |
          set -eu
          base="https://ruabie.github.io/moci-cet4/kotoba"
          for i in $(seq 1 25); do
            html=$(curl -L -sS --max-time 10 -o /tmp/kotoba-index.html -w '%{http_code}' "$base/?check=20261106" || echo 000)
            data=$(curl -L -sS --max-time 10 -o /tmp/kotoba-book-data.js -w '%{http_code}' "$base/book-data.js?v=5.1" || echo 000)
            app=$(curl -L -sS --max-time 10 -o /tmp/kotoba-app.js -w '%{http_code}' "$base/app.js?v=5.1" || echo 000)
            echo "Attempt $i: html=$html data=$data app=$app"
            if [ "$html" = 200 ] && [ "$data" = 200 ] && [ "$app" = 200 ] &&
               grep -q 'book-data.js?v=5.1' /tmp/kotoba-index.html &&
               grep -q 'window.KOTOBA_BOOK' /tmp/kotoba-book-data.js &&
               grep -q '"lessons"' /tmp/kotoba-book-data.js &&
               grep -q 'window.KOTOBA_BOOK' /tmp/kotoba-app.js; then
              echo "KOTOBA LIVE ASSETS VERIFIED"
              exit 0
            fi
            sleep 6
          done
          echo "Kotoba live HTML/scripts are not consistent"
          exit 1
