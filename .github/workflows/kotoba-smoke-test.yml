name: Kotoba published-site check
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and nonrepeating study rounds
        shell: bash
        run: |
          node --check kotoba/app.js
          node --check kotoba/book-data.js
          node .github/tests/kotoba-rotation.test.cjs
      - name: Verify live HTML, vocabulary and updated app
        shell: bash
        run: |
          set -eu
          base="https://ruabie.github.io/moci-cet4/kotoba"
          for i in $(seq 1 30); do
            html=$(curl -L -sS --max-time 10 -o /tmp/kotoba-index.html -w '%{http_code}' "$base/?check=20261107rotation" || echo 000)
            data=$(curl -L -sS --max-time 10 -o /tmp/kotoba-book-data.js -w '%{http_code}' "$base/book-data.js?v=5.1" || echo 000)
            app=$(curl -L -sS --max-time 10 -o /tmp/kotoba-app.js -w '%{http_code}' "$base/app.js?v=5.2" || echo 000)
            echo "Attempt $i: html=$html data=$data app=$app"
            if [ "$html" = 200 ] && [ "$data" = 200 ] && [ "$app" = 200 ] &&
               grep -q 'app.js?v=5.2' /tmp/kotoba-index.html &&
               grep -q 'window.KOTOBA_BOOK' /tmp/kotoba-book-data.js &&
               grep -q 'remainingNewWords' /tmp/kotoba-app.js &&
               grep -q 'markIntroduced' /tmp/kotoba-app.js; then
              node --check /tmp/kotoba-app.js
              echo "KOTOBA LIVE ROTATION BUILD VERIFIED"
              exit 0
            fi
            sleep 6
          done
          echo "Kotoba published assets do not match the expected release"
          exit 1
