name: Kotoba published-site check
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript and consecutive learning rounds
        shell: bash
        run: |
          set -eu
          for f in kotoba/app.js kotoba/book-data.js kotoba/vocab-{13,14,15,16}.js kotoba/sw.js; do node --check "$f"; done
          node .github/tests/kotoba-rotation.test.cjs
          node .github/tests/kotoba-catalog-v6.test.cjs
      - name: Verify currently published HTML and its versioned assets
        shell: bash
        run: node .github/tests/kotoba-live-site.test.cjs
